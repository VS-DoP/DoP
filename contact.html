<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contact</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 40px;
    text-align: center;
}

img {
    width: 300px;
    max-width: 80%;
    margin-top: 30px;
    border-radius: 10px;
}


/* Bloquear clic derecho (anti-descarga básica)   margin-bottom: 40px;*/
body {
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}
img {
    pointer-events: none;
}


/* Barra superior */
.topbar {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 90px;
background: #000;
display: flex;
justify-content: center;
align-items: center;
z-index: 2000;
border-bottom: 1px solid #000;
}

/* Logo centrado */
.topbar img {
height: 60px;
}

/* Menú hamburguesa */
.menu-btn {
position: absolute;
right: 20px;
top: 15px;
font-size: 28px;
cursor: pointer;
color: white;
}
/* Panel del menú */
.menu-panel {
    position: fixed;
    top: 60px;
    right: 0;
    width: 180px;
    background: rgba(0,0,0,0.9);
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 15px;
    z-index: 2001;
}

.menu-panel a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.menu-panel a:hover {
    color: #aaa;
}

/* Espacio entre barra de logo y h1 */
h1 {
    margin-top: 90px; /* 60px (topbar) + 30px extra space */
}

/*** Estilos para el formulario de contacto */
form {
    max-width: 400px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 15px;
}

input, textarea {
    padding: 10px;
    border-radius: 6px;
    border: none;
    font-size: 16px;
}

button {
    padding: 12px;
    background: white;
    color: black;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #ccc;
}

</style>
</head>

<body>

<!--menu -->
       <div class="topbar">
           <img src="logo.png" alt="Logo">
           <div class="menu-btn" onclick="toggleMenu()">☰</div>
       </div>

       <div class="menu-panel" id="menu">
           <a href="indexfilm.html">Film</a>
           <a href="foto.html">Photography</a>
           <a href="contact.html">Contact</a>
       </div>




<h1>About me</h1>

<p>
Soy...
Puedes escribirme para proyectos, colaboraciones o información adicional.<br>
Email: <strong>sss@ejemplo.com</strong>
</p>

<!--formulario de contacto-->

<form action="https://formsubmit.co/aeca361a2cb362a849817a1cde11f625" method="POST">

    <input type="hidden" name="_next" value="https://veronicastorm.com/contact.html">

    <label>Name</label>
    <input type="text" name="name" required>

    <label>Subject</label>
    <input type="text" name="subject" required>

    <label>Email</label>

    <label>Message</label>

    <button type="submit">Send</button>

<img src="assets/contact/yo.JPG" alt="Foto de contacto">

</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
}
</script>

</body>
</html>
