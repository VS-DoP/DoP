<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Photography</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    padding: 20px;
}

/* Bloquear clic derecho (anti-descarga básica) */
body {
    -webkit-user-select: none;
    -webkit-touch-callout: none;
}
img {
    pointer-events: none;
}

/* Galería */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 40px;
}

@media (max-width: 900px) {
    .gallery {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .gallery {
        grid-template-columns: 1fr;
    }
}

.item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
}

.item img {
    width: 100%;
    height: auto;
    object-fit: contain;
}
/* Barra superior */
.topbar {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 60px;
background: #000;
display: flex;
justify-content: center;
align-items: center;
z-index: 2000;
border-bottom: 1px solid #000000;
}

/* Logo centrado */
.topbar img {
height: 60px;
}

/* Menú hamburguesa */
.menu-btn {
position: absolute;
right: 20px;
top: 15px;
font-size: 28px;
cursor: pointer;
color: white;
}
/* Panel del menú */
.menu-panel {
    position: fixed;
    top: 60px;
    right: 0;
    width: 180px;
    background: rgba(0,0,0,0.9);
    padding: 20px;
    display: none;
    flex-direction: column;
    gap: 15px;
    z-index: 2001;
}

.menu-panel a {
    color: white;
    text-decoration: none;
    font-size: 18px;
}

.menu-panel a:hover {
    color: #aaa;
}

/* Espacio entre barra de logo y h1 */
h1 {
    margin-top: 90px; /* 60px (topbar) + 30px extra space */
}

/* Footer Copyright */
footer {
    margin-top: 80px;
    padding: 30px 20px;
    border-top: 1px solid #333;
    color: #999;
    font-size: 14px;
    text-align: center;
}

</style>
</head>

<body>

       <div class="topbar">
           <img src="logo.png" alt="Logo">
           <div class="menu-btn" onclick="toggleMenu()">☰</div>
       </div>

       <div class="menu-panel" id="menu">
           <a href="index.html">Film</a>
           <a href="foto.html">Photography</a>
           <a href="contact.html">Contact</a>
       </div>

<script>
function toggleMenu() {
    const menu = document.getElementById("menu");
    menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
